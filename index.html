.reading-layout{max-width:860px;margin:0 auto}.lesson-section{padding:25px 0;border-bottom:1px solid var(--border-soft)}.lesson-section h2{font-size:22px;margin:0 0 12px}.lesson-section p,.lesson-section li{color:#C1CBD4;line-height:1.78}.lesson-section ul{padding-left:22px}.lesson-section li::marker{color:var(--gold)}pre{background:#02080D;border:1px solid var(--border-soft);border-radius:13px;padding:18px;overflow:auto;color:#E8D59E;line-height:1.6}.practice-panel,.interview-panel{margin-top:38px;border:1px solid var(--border);border-radius:22px;padding:25px;background:linear-gradient(145deg,rgba(213,166,65,.07),rgba(8,28,44,.75))}.interview-panel{background:linear-gradient(145deg,rgba(20,52,79,.8),rgba(5,17,27,.88))}.panel-kicker{display:flex;align-items:center;gap:7px;color:var(--gold-bright);font-size:10px;font-weight:900;letter-spacing:.14em}.practice-item{padding:15px 0;border-top:1px solid var(--border-soft)}.practice-item textarea,.interview-card textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--border-soft);background:#05121D;color:var(--ivory);border-radius:12px;padding:13px;outline:none;line-height:1.6}.practice-item textarea:focus,.interview-card textarea:focus{border-color:var(--gold)}.practice-item small{display:block;margin-top:6px;color:var(--muted-2)}.qa-row{border-top:1px solid var(--border-soft)}.qa-row button{width:100%;border:0;background:none;color:var(--text);display:flex;justify-content:space-between;align-items:center;text-align:left;padding:15px 0;cursor:pointer}.qa-row p{margin:-2px 25px 16px 0;color:#BFC9D1;line-height:1.65}.module-nav{display:flex;justify-content:space-between;margin-top:45px;border-top:1px solid var(--border-soft);padding-top:22px}.module-nav button{border:0;background:none;color:var(--gold-bright);display:flex;align-items:center;gap:6px;cursor:pointer}.practice-list,.journal-list{display:grid;gap:18px}.practice-module,.journal-entry{border:1px solid var(--border-soft);border-radius:var(--radi rce-card:hover{border-color:var(--border);background:rgba(14,42,64,.9)}.callout{margin-top:25px;border:1px solid var(--border);border-radius:18px;padding:22px;display:flex;gap:16px;background:rgba(213,166,65,.05)}.callout h3{margin:0 0 6px}.callout p{margin:0;color:var(--muted);line-height:1.6}.icon-btn{border:1px solid var(--border-soft);background:rgba(255,255,255,.04);border-radius:10px;padding:8px;display:flex;cursor:pointer}.sidebar-backdrop{display:none}

.svg-icon{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1}.sidebar .brand img{background:transparent}.html-icon{font-size:18px;line-height:1}.hidden{display:none!important}.static-main{margin-left:280px;min-height:100vh}.nav-badge{margin-left:auto;font-size:10px;color:var(--gold);opacity:.7}.search-box{display:flex;gap:8px;align-items:center;border:1px solid var(--border-soft);background:#071725;border-radius:12px;padding:8px 12px;margin-bottom:20px}.search-box input{border:0;outline:0;background:transparent;color:var(--text);width:100%}.toast{position:fixed;right:25px;bottom:25px;background:#102B45;border:1px solid var(--border);padding:12px 16px;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.28);z-index:60;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.module-list-btn{font:inherit}.section-body{white-space:pre-wrap}.interview-answer{margin-top:20px}.save-indicator{color:var(--success)!important}</style></head><body><div id="app"></div><div id="toast" class="toast">Guardado</div><script>
const logo="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20200%20200%27%3E%3Ccircle%20cx=%27100%27%20cy=%27100%27%20r=%2794%27%20fill=%27%2306111A%27%20stroke=%27%23D5A641%27%20stroke-width=%276%27/%3E%3Cpath%20d=%27M100%20100C72%2058%2035%2052%2026%2066c13%2040%2039%2058%2074%2049M100%20100c28-42%2065-48%2074-34-13%2040-39%2058-74%2049M100%20104c-20%2016-30%2038-24%2055%2014-2%2024-14%2030-33m-6-22c20%2016%2030%2038%2024%2055-14-2-24-14-30-33%27%20fill=%27none%27%20stroke=%27%23F0D38A%27%20stroke-width=%2710%27%20stroke-linecap=%27round%27/%3E%3Ccircle%20cx=%27100%27%20cy=%2788%27%20r=%2710%27%20fill=%27%23F0D38A%27/%3E%3Cpath%20d=%27M88%2068l12-18%2012%2018%27%20fill=%27none%27%20stroke=%27%23F0D38A%27%20stroke-width=%276%27/%3E%3C/svg%3E";
const modules=[{id:1,title:'Qué hace un Tester',short:'Rol, calidad, riesgo y diferencia entre QA y Testing.',accent:'Fundamentos',sections:[{title:'¿Qué es Testing?',body:'Testing es el conjunto de actividades que realizamos para evaluar un software, comprobar su comportamiento y obtener información sobre su calidad. Encontrar bugs es importante, pero también buscamos detectar riesgos, aumentar la confianza y aportar información para tomar decisiones.'},{title:'¿Qué hace un Tester?',bullets:['Analiza requerimientos y riesgos.','Diseña y ejecuta pruebas.','Prepara datos y ambientes.','Reporta defectos con evidencia.','Verifica correcciones y realiza regresiones.','Comunica el estado de calidad al equipo.']},{title:'QA y Testing no son lo mismo',body:'Testing se enfoca principalmente en evaluar el producto. Quality Assurance tiene un alcance más amplio y busca mejorar los procesos utilizados para construir y verificar ese producto. La calidad es responsabilidad del equipo, no solamente de QA.'}],practices:['Entrás por primera vez a una tienda online con Login, Registro, Catálogo, Buscador, Carrito y Checkout. ¿Qué probarías primero y por qué?','Elegí una funcionalidad crítica de una aplicación que uses. ¿Qué riesgo sería más importante detectar antes de liberar una nueva versión?'],interview:[{q:'¿Qué hace un Tester?',a:'Analiza el producto y sus riesgos, diseña y ejecuta pruebas, reporta defectos, verifica correcciones y comunica información sobre calidad para ayudar al equipo a tomar decisiones.'},{q:'¿QA y Testing son lo mismo?',a:'No exactamente. Testing se enfoca en evaluar el producto; QA tiene un alcance más amplio y también trabaja sobre los procesos utilizados para construir y verificar ese producto.'},{q:'¿El objetivo de Testing es encontrar bugs?',a:'Encontrar bugs es uno de sus objetivos, pero también buscamos evaluar calidad, detectar riesgos, aumentar confianza y aportar información para decidir.'}]},{id:2,title:'Waterfall, Agile y Scrum',short:'Cómo trabaja el equipo y dónde participa QA.',accent:'Metodologías',sections:[{title:'Waterfall',body:'En Waterfall o Cascada el proyecto avanza por etapas sucesivas: Requerimientos → Diseño → Desarrollo → Testing → Entrega. Volver a una etapa anterior suele ser más costoso cuando los problemas aparecen tarde.'},{title:'Agile',body:'Agile propone trabajar de forma iterativa, entregar valor con frecuencia y adaptarse a cambios. No significa ausencia de planificación ni de documentación: significa que el plan puede evolucionar a partir de información real.'},{title:'Scrum en pocas palabras',body:'Scrum organiza trabajo complejo en Sprints. Dentro del Scrum Team encontramos Product Owner, Scrum Master y Developers. QA puede participar desde el análisis del requerimiento hasta el cierre y la comunicación de riesgos.'},{title:'Eventos que vas a escuchar',bullets:['Sprint Planning: qué vamos a trabajar.','Daily Scrum: progreso, próximos pasos y bloqueos.','Sprint Review: revisamos el producto y el incremento.','Retrospective: revisamos cómo trabajamos y qué mejorar.']}],practices:['Durante la Daily encontraste un bug que bloquea tus pruebas. ¿Qué información comunicarías al equipo?','El requerimiento de Login no explica qué ocurre con una contraseña incorrecta. ¿En qué momento deberías detectar y conversar esa ambigüedad?'],interview:[{q:'¿Qué es una Daily?',a:'Es una reunión breve para inspeccionar el progreso hacia el objetivo del Sprint, identificar bloqueos y organizar el trabajo próximo.'},{q:'¿Qué es un Sprint?',a:'Es un período de trabajo de duración fija, de un mes o menos, durante el cual el equipo trabaja para alcanzar un objetivo.'},{q:'¿Dónde participa QA en Scrum?',a:'Puede participar durante todo el ciclo: análisis, definición de cobertura, preparación, ejecución, reporte, retest, regresión y comunicación de riesgos.'}]},{id:3,title:'Tipos de pruebas',short:'Funcionales, no funcionales, niveles, smoke, retest y regresión.',accent:'Testing',sections:[{title:'Funcional vs no funcional',body:'Las pruebas funcionales verifican qué hace el sistema y si cumple con el comportamiento esperado. Las no funcionales evalúan características como rendimiento, seguridad, usabilidad, compatibilidad o accesibilidad.'},{title:'Caja negra vs caja blanca',body:'Caja negra diseña pruebas sin basarse en la estructura interna del sistema. Caja blanca utiliza conocimiento de código, condiciones o caminos internos. No son sinónimos de funcional y no funcional.'},{title:'Niveles',bullets:['Unitarias / componente','Integración','Sistema','Aceptación']},{title:'Pruebas frecuentes',bullets:['Smoke: verifica rápidamente que lo principal esté disponible.','Retest / Confirmation: comprueba específicamente un fix.','Regression: verifica que un cambio no haya afectado otras funcionalidades.','Exploratory: aprender, diseñar y ejecutar mientras se explora.','Performance / Load / Stress: comportamiento, carga esperada y límites.']}],practices:['Se corrigió un error en recuperación de contraseña. Primero repetís exactamente el escenario fallido y después probás Login, Logout, Registro y Perfil. ¿Qué tipo de prueba es cada etapa?','Una tienda tarda 18 segundos en responder aunque devuelve el resultado correcto. ¿Qué tipo de problema investigarías?'],interview:[{q:'¿Qué diferencia hay entre Retest y Regression?',a:'Retest verifica específicamente que el defecto corregido haya quedado resuelto. Regression busca comprobar que ese cambio no haya afectado otras funcionalidades que antes funcionaban.'},{q:'¿Qué es un Smoke Test?',a:'Una verificación rápida de las funcionalidades principales para decidir si la versión es suficientemente estable como para continuar con pruebas más profundas.'},{q:'¿Funcional significa caja negra?',a:'No. Funcional/no funcional describe qué evaluamos; caja negra/caja blanca describe desde qué conocimiento diseñamos la prueba.'}]},{id:4,title:'Requerimientos y documentación funcional',short:'Entender, preguntar y documentar antes de probar.',accent:'Análisis',sections:[{title:'Requerimiento, historia y criterios',body:'Un requerimiento describe una necesidad que el sistema debe cumplir. Una historia de usuario expresa esa necesidad desde el punto de vista del usuario y los criterios de aceptación definen condiciones verificables para considerarla correcta.'},{title:'Reglas y alcance',body:'Una regla de negocio establece condiciones que el sistema debe respetar. El alcance indica qué forma parte de la entrega y qué queda fuera. Ambos son necesarios para evitar falsos bugs y cobertura mal enfocada.'},{title:'Cuando algo no está claro',body:'No inventamos el comportamiento. Preguntamos. “La password debe ser segura” no es una regla verificable hasta definir longitud, caracteres y condiciones concretas.'},{title:'¿Y si no existe documentación?',body:'Exploramos, observamos, investigamos, preguntamos y documentamos. Un QA con autonomía construye contexto y deja trazabilidad de lo aprendido.'},{title:'Template funcional básico',bullets:['Nombre del módulo','Objetivo','Actor','Precondiciones','Flujo principal','Campos y acciones','Validaciones y reglas','Mensajes','Excepciones']}],practices:['Recibís: “Como usuario quiero registrarme utilizando mi correo electrónico”. Escribí cinco preguntas que harías antes de diseñar pruebas.','Elegí un módulo de una web sin documentación. ¿Qué información relevarías para poder redactar un documento funcional básico?'],interview:[{q:'¿Qué hacés si no hay documentación?',a:'Exploro la funcionalidad, investigo su comportamiento, identifico reglas y validaciones, consulto dudas con el equipo y documento lo aprendido antes de diseñar la cobertura.'},{q:'¿Qué hacés ante un requerimiento ambiguo?',a:'No asumo. Identifico la ambigüedad, formulo preguntas concretas y busco una definición verificable antes de reportar defectos o diseñar cobertura basada en supuestos.'},{q:'¿Qué diferencia hay entre historia de usuario y caso de prueba?',a:'La historia describe una necesidad del usuario. El caso de prueba define cómo vamos a verificar un comportamiento relacionado con esa necesidad.'}]},{id:5,title:'Diseño de casos + Gherkin',short:'Del requerimiento a una cobertura útil y explicable.',accent:'Diseño',sections:[{title:'¿Qué es un caso de prueba?',body:'Describe qué queremos verificar, bajo qué condiciones, qué acciones realizamos y qué resultado esperamos. La planilla registra el razonamiento; el trabajo de Testing comienza antes de abrir Excel.'},{title:'Template oficial Moth Academy',bullets:['ID','Título','Descripción','Precondiciones','Pasos','Resultado esperado','Resultado obtenido']},{title:'Positivos y negativos',body:'Un caso positivo verifica condiciones válidas. Un caso negativo comprueba cómo responde el sistema ante datos inválidos, faltantes o situaciones no permitidas.'},{title:'Técnicas simples',bullets:['Valores límite','Particiones de equivalencia','Error Guessing','Cobertura basada en riesgos']},{title:'Gherkin',body:'Gherkin describe comportamientos utilizando Dado / Cuando / Entonces. Puede servir como lenguaje común entre negocio, QA y desarrollo, y como base para BDD.'},{title:'Ejemplo Gherkin',code:'Dado que existe un usuario registrado\nY se encuentra en la pantalla de Login\nCuando ingresa credenciales válidas\nEntonces accede correctamente a su cuenta'}],practices:['Una contraseña acepta entre 8 y 20 caracteres. ¿Qué valores elegirías para probar los límites y por qué?','Para un buscador que no permite búsquedas vacías, diseñá un caso positivo, dos negativos y un escenario adicional no explícito en el criterio.'],interview:[{q:'¿Qué campos utilizás en un caso de prueba?',a:'ID, título, descripción, precondiciones, pasos, resultado esperado y resultado obtenido.'},{q:'¿Qué es Gherkin?',a:'Una forma estructurada de describir comportamientos, normalmente con Dado, Cuando y Entonces, para que negocio, QA y desarrollo puedan compartir una misma lectura del escenario.'},{q:'¿Cómo decidís qué casos escribir?',a:'Parto de requerimientos, criterios y reglas; después analizo escenarios positivos, negativos, límites, equivalencias y riesgos para lograr cobertura útil sin duplicar pruebas.'}]},{id:6,title:'Bugs y reporte de defectos',short:'Encontrar no alcanza: hay que comunicar y dar evidencia.',accent:'Defectos',sections:[{title:'Antes de reportar',bullets:['Intentar reproducir nuevamente.','Confirmar ambiente, versión, navegador y datos.','Verificar si realmente contradice una regla o requerimiento.','Recopilar evidencia útil.','No confundir preferencia personal con defecto.']},{title:'Template de bug',bullets:['Título','Tipo','Severidad','Prioridad','Frecuencia / reproducibilidad','Ambiente y versión','Path / URL','Precondiciones','Pasos','Resultado esperado','Resultado obtenido','Evidencia']},{title:'Severidad vs prioridad',body:'Severidad indica impacto. Prioridad indica urgencia. Un problema visual puede tener severidad baja pero prioridad alta si afecta una campaña crítica.'},{title:'Ciclo de vida',body:'Un flujo simple puede ser Nuevo → Asignado → En progreso → Resuelto → Retest → Cerrado. También aparecen estados como Reabierto, Duplicate, Cannot Reproduce, Won’t Fix y By Design.'},{title:'Trazabilidad',body:'Relacionar el caso que encontró el problema con el bug ayuda a saber qué volver a probar. Ejemplo: TC-CHECKOUT-014 → BUG-382.'}],practices:['Reescribí profesionalmente este bug: “El carrito anda mal. Cuando pongo cosas hace algo raro”. ¿Qué información falta?','Un error ortográfico aparece en el banner principal de una campaña que empieza hoy. ¿Qué severidad y prioridad propondrías? Justificá.'],interview:[{q:'¿Qué diferencia hay entre severidad y prioridad?',a:'Severidad describe el impacto del defecto; prioridad describe qué tan urgente es resolverlo para el negocio o el equipo.'},{q:'¿Qué debe permitir un buen reporte de bug?',a:'Que otra persona pueda entender el contexto, reproducir el problema, investigarlo y verificar la corrección con la menor cantidad posible de información adicional.'},{q:'¿Qué hacés si DEV no puede reproducirlo?',a:'Reviso datos, ambiente, versión, frecuencia, navegador y condiciones específicas, aporto evidencia adicional e intento acotar qué diferencia existe entre ambos contextos.'}]},{id:7,title:'Flujo real de trabajo QA',short:'Tickets, ejecución, bloqueos, retest, regresión y cierre.',accent:'Workflow',sections:[{title:'La tarea llega a QA',body:'Antes de ejecutar revisamos tarea, documentación, criterios, ambiente, versión, datos y casos. Testing tiene un objetivo y un contexto.'},{title:'Workflow simple',body:'To Do → In Progress → Ready for QA → Testing → QA Fail / QA OK → Regression → Done. Los nombres cambian según la empresa, pero el flujo comunica dónde está el trabajo.'},{title:'PASS, FAIL y BLOCKED',body:'PASS: esperado y obtenido coinciden. FAIL: no coinciden y puede derivar en un bug. BLOCKED: la prueba no pudo ejecutarse por una dependencia; no equivale a FAIL.'},{title:'Suites y ciclos',body:'Una suite agrupa casos relacionados. Un ciclo representa la ejecución de una o varias suites sobre una versión concreta.'},{title:'QA OK no significa cero bugs',body:'Significa que, dentro de la cobertura realizada y la información disponible, no se encontraron defectos que impidan avanzar. También debemos comunicar cobertura no ejecutada y riesgos residuales.'}],practices:['Una tarea queda Ready for QA. Describí tu secuencia de trabajo desde que la recibís hasta que podés recomendar QA OK o QA Fail.','Checkout no puede probarse porque el ambiente de pagos está caído. ¿Marcarías FAIL o BLOCKED? ¿Qué comunicarías?'],interview:[{q:'¿Qué hacés cuando una tarea llega a QA?',a:'Reviso requerimiento, criterios, documentación, ambiente y versión, preparo datos y cobertura, ejecuto, registro resultados y reporto defectos con trazabilidad.'},{q:'¿Qué significa QA OK?',a:'Que según la cobertura ejecutada y la información disponible la funcionalidad cumple con lo esperado y no se identificaron defectos que impidan avanzar. No significa ausencia absoluta de bugs.'},{q:'¿Qué hacés después de que DEV corrige un bug?',a:'Primero realizo retest del escenario fallido y luego evalúo el impacto del cambio para definir la regresión necesaria.'}]},{id:8,title:'Testing Web, DevTools, HTTP, API y Postman',short:'Mirar detrás de la pantalla para investigar mejor.',accent:'Web & API',sections:[{title:'DevTools para QA',bullets:['Elements: estructura HTML.','Console: errores y mensajes del navegador.','Network: requests, responses, status y tiempos.','Application: cookies y almacenamiento.','Device Toolbar: responsive y tamaños de pantalla.']},{title:'HTTP básico',bullets:['GET: consultar.','POST: crear o enviar.','PUT / PATCH: modificar.','DELETE: eliminar.','200 OK · 201 Created · 400 Bad Request · 401 Unauthorized · 403 Forbidden · 404 Not Found · 500 Internal Server Error']},{title:'Request y Response',body:'Una aplicación envía una Request a un servidor y recibe una Response. Network permite observar esa conversación y aportar evidencia técnica.'},{title:'API y JSON',body:'Una API permite que diferentes aplicaciones o componentes se comuniquen mediante una interfaz definida. JSON es un formato muy utilizado para intercambiar información.'},{title:'Postman',body:'Postman permite enviar requests manualmente, analizar status, headers, body y tiempos sin depender de la interfaz gráfica. El objetivo inicial no es automatizar: es aprender a investigar.'}],practices:['Abrí OpenCart con DevTools → Network, realizá una búsqueda y observá método, URL y status. ¿Qué información nueva obtenés respecto de mirar sólo la pantalla?','Una pantalla muestra precio $150, pero Network indica que la respuesta contiene price: 180. ¿Qué información adjuntarías al bug y qué evitarías afirmar sin investigar más?'],interview:[{q:'¿Qué mirás en DevTools si una acción falla?',a:'Reviso Console para errores del navegador y Network para analizar requests, responses, status codes y tiempos asociados a la acción.'},{q:'¿Qué es una API?',a:'Una interfaz que permite que diferentes sistemas o componentes se comuniquen siguiendo reglas definidas.'},{q:'¿Para qué utilizaste Postman?',a:'Para realizar pruebas manuales de APIs enviando requests y analizando status codes, headers, bodies, tiempos y responses JSON.'}]},{id:9,title:'De alumno a candidato QA',short:'CV, LinkedIn, entrevistas y búsqueda laboral.',accent:'Empleabilidad',sections:[{title:'Perfil profesional',body:'Tu perfil debe dejar claro qué sabés, qué hiciste y qué tipo de rol buscás. No inventamos experiencia, pero tampoco minimizamos la formación práctica.'},{title:'CV',bullets:['Datos y contacto profesional.','Perfil breve orientado a QA.','Conocimientos y herramientas que realmente puedas defender.','Proyecto práctico Moth Academy correctamente presentado.','Formación y cursos relevantes.','Una o dos páginas, claro y fácil de leer.']},{title:'LinkedIn',body:'CV y LinkedIn tienen que contar la misma historia. Titular, About, proyecto, skills y cursos deberían apuntar al perfil profesional que buscás.'},{title:'Contá lo que hiciste',body:'En vez de “vi casos de prueba”, explicá qué analizaste, qué diseñaste, cómo ejecutaste, qué bugs reportaste y qué aprendiste. La experiencia práctica se cuenta como práctica, no como empleo formal.'},{title:'Entrevistas situacionales',body:'Además de definiciones pueden preguntarte cómo actuarías ante documentación incompleta, un bug que DEV no reproduce, poco tiempo para una regresión o un defecto crítico antes de producción.'}],practices:['Escribí una presentación profesional de máximo cinco líneas y diez skills que realmente puedas defender en una entrevista.','Prepará tu presentación de 60 segundos: quién sos, qué estudiaste, qué practicaste, qué herramientas usaste y qué estás buscando.'],interview:[{q:'¿Cómo presentás tu experiencia práctica sin inventar experiencia laboral?',a:'Aclaro que busco mi primera experiencia formal si corresponde y cuento concretamente el proyecto práctico realizado: análisis, documentación, casos, ejecución, bugs, DevTools, API y herramientas de gestión.'},{q:'¿Qué hacés si en una entrevista te preguntan algo que no sabés?',a:'No invento. Explico con honestidad qué conozco, qué no trabajé todavía y cómo abordaría aprenderlo o investigarlo.'},{q:'¿Cómo priorizarías una regresión con muy poco tiempo?',a:'Analizaría el riesgo del cambio, las funcionalidades críticas, el impacto y el historial de fallos para concentrar la cobertura donde una regresión tendría mayor costo para usuario o negocio.'}]}];
const initialState={completedModules:[],practiceAnswers:{},interviewAnswers:{}};
let state=loadState(),view='home',activeModule=1,mobileOpen=false,interviewIndex=0,interviewFilter='all',revealAnswer=false;
const allInterviewQuestions=modules.flatMap(m=>m.interview.map((x,i)=>({...x,id:`${m.id}-${i}`,moduleId:m.id,moduleTitle:m.title})));
function loadState(){try{return {...initialState,...JSON.parse(localStorage.getItem('moth-academy-progress')||'{}')}}catch{return {...initialState}}}
function saveState(){localStorage.setItem('moth-academy-progress',JSON.stringify(state))}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function progress(){return Math.round((state.completedModules.length/modules.length)*100)}
function go(v){view=v;mobileOpen=false;window.scrollTo({top:0,behavior:'smooth'});render()}
function openModule(id){activeModule=id;view='module';mobileOpen=false;window.scrollTo({top:0});render()}
function toggleComplete(id){const s=new Set(state.completedModules);s.has(id)?s.delete(id):s.add(id);state.completedModules=[...s].sort((a,b)=>a-b);saveState();render()}
function setPractice(m,i,v){state.practiceAnswers[`${m}-${i}`]=v;saveState();setTimeout(()=>{const el=document.querySelector(`[data-practice="${m}-${i}"]`);if(el?.nextElementSibling)el.nextElementSibling.textContent='Respuesta guardada.'},120)}
function setInterview(id,v){state.interviewAnswers[id]=v;saveState()}
function flash(t){const el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
function shell(content){const pct=progress();return `<div class="app-shell"><div class="sidebar-backdrop ${mobileOpen?'show':''}" data-action="close-menu"></div><aside class="sidebar ${mobileOpen?'open':''}"><button class="sidebar-close icon-btn" data-action="close-menu">×</button><button class="brand" data-go="home"><img src="${logo}" alt="Logo de Moth Academy"><div><span>MOTH</span><strong>ACADEMY</strong><small>QA Study & Practice</small></div></button><nav>${[['home','⌂','Inicio'],['modules','▤','Módulos'],['practice','✎','Práctica'],['interview','◎','Entrevista'],['journal','◉','Mi bitácora'],['resources','▣','Recursos']].map(([v,i,l])=>`<button class="${view===v?'active':''}" data-go="${v}"><span>${i}</span>${l}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="mini-progress"><div><span>Tu progreso</span><strong>${pct}%</strong></div><div class="progress-track"><i style="width:${pct}%"></i></div></div><div class="data-actions"><button data-action="export">⇩ Exportar progreso</button><label>⇧ Importar progreso<input id="import-progress" type="file" accept="application/json"></label><button class="danger-ghost" data-action="reset">↻ Reiniciar</button></div><p class="storage-note">Tus respuestas se guardan sólo en este navegador.<br>Podés exportarlas para llevarlas a otro dispositivo.</p></div></aside><main class="main"><header class="mobile-header"><button class="icon-btn" data-action="open-menu">☰</button><div class="mobile-brand"><img src="${logo}" alt=""><strong>Moth Academy</strong></div></header>${content}</main></div>`}
function pageTitle(k,t,d){return `<div class="page-title"><span class="label">${k}</span><h1>${t}</h1><p>${d}</p></div>`}
function moduleCard(m){const done=state.completedModules.includes(m.id);return `<button class="module-card ${done?'done':''}" data-module="${m.id}"><div class="module-number">0${m.id}</div><div class="module-card-copy"><span>${m.accent}</span><h3>${m.title}</h3><p>${m.short}</p></div><div class="module-status">${done?'✓ Repasado':'○ Por repasar'}</div></button>`}
function home(){const next=modules.find(m=>!state.completedModules.includes(m.id))||modules[0],answerCount=Object.values(state.practiceAnswers).filter(v=>v.trim()).length,intCount=Object.values(state.interviewAnswers).filter(v=>v.trim()).length;return `<div class="page"><section class="hero"><div class="hero-copy"><span class="eyebrow">✦ Aprender · Practicar · Evolucionar</span><h1>Tu compañero de entrenamiento <em>QA</em>.</h1><p>Repasá conceptos, practicá criterio y prepará entrevistas sin notas, sin login y sin ruido. Lo importante no es memorizar: es poder explicar qué harías y por qué.</p><div class="hero-actions"><button class="primary" data-module="${next.id}">Continuar con Módulo ${next.id} ›</button><button class="secondary" data-go="interview">Practicar entrevista ◎</button></div></div><div class="hero-mark"><img src="${logo}" alt="Moth Academy"></div></section><section class="dashboard-grid"><div class="progress-card large"><div class="card-top"><div><span class="label">RECORRIDO</span><h2>${state.completedModules.length} de 9 módulos repasados</h2></div><strong class="big-number">${progress()}%</strong></div><div class="progress-track big"><i style="width:${progress()}%"></i></div><div class="stat-row"><span>✓ ${state.completedModules.length} módulos</span><span>✎ ${answerCount} prácticas respondidas</span><span>◎ ${intCount} respuestas de entrevista</span></div></div><button class="quick-card" data-go="journal"><span>◉</span><div><span>Mi bitácora</span><small>Volvé a leer lo que respondiste.</small></div><span>›</span></button><button class="quick-card" data-go="resources"><span>▣</span><div><span>Recursos</span><small>Herramientas y referencias recomendadas.</small></div><span>›</span></button></section><section class="section-block"><div class="section-heading"><div><span class="label">PROGRAMA</span><h2>Los 9 módulos</h2></div><button class="text-link" data-go="modules">Ver todos ›</button></div><div class="module-grid compact">${modules.slice(0,6).map(moduleCard).join('')}</div></section></div>`}
function modulesView(){return `<div class="page">${pageTitle('MÓDULOS','Tu recorrido QA','Nueve módulos para estudiar, practicar y volver a consultar cuando lo necesites.')}<div class="search-box">⌕ <input id="module-search" placeholder="Buscar módulo o tema..."></div><div id="module-grid" class="module-grid">${modules.map(moduleCard).join('')}</div></div>`}
function moduleView(){const m=modules.find(x=>x.id===activeModule),done=state.completedModules.includes(m.id);return `<div class="page"><div class="module-hero"><div><span class="label">MÓDULO ${m.id} · ${m.accent}</span><h1>${m.title}</h1><p>${m.short}</p></div><button class="complete-btn ${done?'done':''}" data-action="complete" data-id="${m.id}">${done?'✓ Repasado':'Marcar como repasado'}</button></div><div class="reading-layout"><article class="lesson">${m.sections.map(sectionHTML).join('')}${practicePanel(m)}${interviewPanel(m)}</article></div><div class="module-nav">${m.id>1?`<button data-module="${m.id-1}">‹ Módulo ${m.id-1}</button>`:'<span></span>'}${m.id<modules.length?`<button data-module="${m.id+1}">Módulo ${m.id+1} ›</button>`:`<button data-module="1">Volver al inicio ↻</button>`}</div></div>`}
function sectionHTML(s){return `<section class="lesson-section"><h2>${esc(s.title)}</h2>${s.body?`<p>${esc(s.body)}</p>`:''}${s.bullets?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${s.code?`<pre><code>${esc(s.code)}</code></pre>`:''}</section>`}
function practicePanel(m){return `<section class="practice-panel"><span class="panel-kicker">✎ PRÁCTICA</span><h2>Probalo vos</h2>${m.practices.map((p,idx)=>practiceItem(m,idx,p)).join('')}</section>`}
function practiceItem(m,idx,p){const key=`${m.id}-${idx}`,val=state.practiceAnswers[key]||'';return `<div class="practice-item"><p><strong>${idx+1}.</strong> ${esc(p)}</p><textarea data-practice="${key}" placeholder="Escribí tu respuesta. Se guarda automáticamente en este navegador.">${esc(val)}</textarea><small class="${val?'save-indicator':''}">${val?'Respuesta guardada.':'Todavía sin respuesta.'}</small></div>`}
function interviewPanel(m){return `<section class="interview-panel"><span class="panel-kicker">◎ TE PUEDEN PREGUNTAR</span><h2>Preguntas de entrevista</h2>${m.interview.map((x,idx)=>`<div class="qa-row"><button data-disclosure="${m.id}-${idx}"><span>${esc(x.q)}</span><span>›</span></button><p id="disc-${m.id}-${idx}" class="hidden">${esc(x.a)}</p></div>`).join('')}</section>`}
function practiceView(){return `<div class="page">${pageTitle('PRÁCTICA','Pensar antes de responder','No hay puntaje. Escribí tu criterio y volvé más adelante para comparar cómo evolucionó tu respuesta.')}<div class="practice-list">${modules.map(m=>`<section class="practice-module"><div class="practice-module-head"><div><span>MÓDULO ${m.id}</span><h2>${esc(m.title)}</h2></div><button class="text-link" data-module="${m.id}">Abrir módulo ›</button></div>${m.practices.map((p,idx)=>practiceItem(m,idx,p)).join('')}</section>`).join('')}</div></div>`}
function interviewView(){const list=interviewFilter==='all'?allInterviewQuestions:allInterviewQuestions.filter(q=>q.moduleId===Number(interviewFilter));if(interviewIndex>=list.length)interviewIndex=0;const q=list[interviewIndex],val=state.interviewAnswers[q.id]||'';return `<div class="page">${pageTitle('MODO ENTREVISTA','Respondé antes de revelar','Entrená una respuesta natural. La guía sirve para comparar ideas, no para memorizar palabra por palabra.')}<div class="interview-toolbar"><label>Filtrar por módulo<select id="interview-filter"><option value="all">Todos los módulos</option>${modules.map(m=>`<option value="${m.id}" ${String(interviewFilter)===String(m.id)?'selected':''}>Módulo ${m.id} · ${esc(m.title)}</option>`).join('')}</select></label><button class="secondary" data-action="random">✦ Pregunta aleatoria</button></div><section class="interview-card"><div class="interview-meta"><span>Módulo ${q.moduleId}</span><span>${esc(q.moduleTitle)}</span></div><h2>${esc(q.q)}</h2><textarea data-interview="${q.id}" placeholder="Respondé con tus palabras antes de mirar la guía.">${esc(val)}</textarea><div class="interview-actions"><button class="primary" data-action="reveal">${revealAnswer?'Ocultar guía':'Ver respuesta guía'}</button><button class="secondary" data-action="next-question">Otra pregunta ›</button></div>${revealAnswer?`<div class="answer-guide"><span>RESPUESTA GUÍA</span><p>${esc(q.a)}</p></div>`:''}</section></div>`}
function journalView(){const p=modules.flatMap(m=>m.practices.map((prompt,idx)=>({type:'PRÁCTICA',module:m,prompt,answer:state.practiceAnswers[`${m.id}-${idx}`]}))).filter(x=>x.answer?.trim()),iq=allInterviewQuestions.map(q=>({type:'ENTREVISTA',module:modules.find(m=>m.id===q.moduleId),prompt:q.q,answer:state.interviewAnswers[q.id]})).filter(x=>x.answer?.trim()),entries=[...p,...iq];return `<div class="page">${pageTitle('MI BITÁCORA','Tus respuestas, guardadas','Todo queda en este navegador para que puedas volver, releer y responder de nuevo cuando quieras.')}${entries.length?`<div class="journal-list">${entries.map(e=>`<article class="journal-entry"><div class="journal-tag">${e.type} · MÓDULO ${e.module.id}</div><h3>${esc(e.prompt)}</h3><p>${esc(e.answer)}</p><button class="text-link" data-module="${e.module.id}">Repasar ${esc(e.module.title)} ›</button></article>`).join('')}</div>`:`<div class="empty-state">◉<h2>Tu bitácora todavía está en blanco</h2><p>Respondé una práctica o una pregunta de entrevista y aparecerá acá automáticamente.</p></div>`}</div>`}
function resourcesView(){const rs=[['OpenCart Demo by Abstracta','Laboratorio principal para prácticas funcionales.','https://opencart.abstracta.us/'],['Postman','Herramienta para pruebas manuales de APIs.','https://www.postman.com/'],['Chrome DevTools','Documentación oficial para investigar aplicaciones web.','https://developer.chrome.com/docs/devtools/'],['Scrum Guide','Referencia oficial de Scrum.','https://scrumguides.org/scrum-guide.html?lang=es'],['ISTQB CTFL','Referencia actual para fundamentos de Testing.','https://www.istqb.org/certifications/certified-tester-foundation-level']];return `<div class="page">${pageTitle('RECURSOS','Biblioteca de entrenamiento','Material de apoyo para estudiar y llevar la práctica fuera de la web.')}<div class="resource-grid">${rs.map(r=>`<a class="resource-card" href="${r[2]}" target="_blank" rel="noreferrer"><div><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div><span>›</span></a>`).join('')}</div><div class="callout"><div><h3>La práctica profesional vive fuera de esta app</h3><p>Moth Academy Web es tu herramienta de estudio y repaso. El proyecto práctico, los tickets y las entregas se trabajan con el instructor y el gestor de proyectos.</p></div></div></div>`}
function render(){const map={home,modules:modulesView,module:moduleView,practice:practiceView,interview:interviewView,journal:journalView,resources:resourcesView};document.getElementById('app').innerHTML=shell(map[view]());bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));document.querySelectorAll('[data-module]').forEach(el=>el.onclick=()=>openModule(Number(el.dataset.module)));document.querySelectorAll('[data-action="open-menu"]').forEach(el=>el.onclick=()=>{mobileOpen=true;render()});document.querySelectorAll('[data-action="close-menu"]').forEach(el=>el.onclick=()=>{mobileOpen=false;render()});document.querySelectorAll('[data-action="complete"]').forEach(el=>el.onclick=()=>toggleComplete(Number(el.dataset.id)));document.querySelectorAll('[data-practice]').forEach(el=>el.oninput=e=>{const[m,i]=el.dataset.practice.split('-');setPractice(m,i,e.target.value);el.nextElementSibling.textContent='Guardando...'});document.querySelectorAll('[data-interview]').forEach(el=>el.oninput=e=>setInterview(el.dataset.interview,e.target.value));document.querySelectorAll('[data-disclosure]').forEach(el=>el.onclick=()=>document.getElementById(`disc-${el.dataset.disclosure}`).classList.toggle('hidden'));const filter=document.getElementById('interview-filter');if(filter)filter.onchange=e=>{interviewFilter=e.target.value;interviewIndex=0;revealAnswer=false;render()};document.querySelectorAll('[data-action="reveal"]').forEach(el=>el.onclick=()=>{revealAnswer=!revealAnswer;render()});document.querySelectorAll('[data-action="next-question"]').forEach(el=>el.onclick=()=>{const list=interviewFilter==='all'?allInterviewQuestions:allInterviewQuestions.filter(q=>q.moduleId===Number(interviewFilter));interviewIndex=(interviewIndex+1)%list.length;revealAnswer=false;render()});document.querySelectorAll('[data-action="random"]').forEach(el=>el.onclick=()=>{const list=interviewFilter==='all'?allInterviewQuestions:allInterviewQuestions.filter(q=>q.moduleId===Number(interviewFilter));interviewIndex=Math.floor(Math.random()*list.length);revealAnswer=false;render()});document.querySelectorAll('[data-action="export"]').forEach(el=>el.onclick=exportProgress);document.querySelectorAll('[data-action="reset"]').forEach(el=>el.onclick=resetProgress);const imp=document.getElementById('import-progress');if(imp)imp.onchange=importProgress;const search=document.getElementById('module-search');if(search)search.oninput=e=>filterModules(e.target.value)}
function filterModules(q){const t=q.trim().toLowerCase();document.getElementById('module-grid').innerHTML=modules.filter(m=>!t||`${m.title} ${m.short} ${m.accent}`.toLowerCase().includes(t)).map(moduleCard).join('');document.querySelectorAll('#module-grid [data-module]').forEach(el=>el.onclick=()=>openModule(Number(el.dataset.module)))}
function exportProgress(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),version:1},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`moth-academy-progreso-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}
function importProgress(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);state={...initialState,...p};delete state.exportedAt;delete state.version;saveState();render();flash('Progreso importado')}catch{alert('No pude leer ese archivo de progreso.')}};r.readAsText(f)}
function resetProgress(){if(!confirm('¿Querés borrar todo el progreso y las respuestas guardadas en este navegador?'))return;state={...initialState,completedModules:[],practiceAnswers:{},interviewAnswers:{}};saveState();render()}
render();
</script></body></html>
