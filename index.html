<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06111A">
  <meta name="description" content="Moth Academy · QA Study & Practice. Aprender · Practicar · Evolucionar.">
  <title>Moth Academy · QA Study & Practice</title>
  <link rel="icon" type="image/png" href="./assets/moth-logo.svg">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .svg-icon{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1}.sidebar .brand img{background:transparent}.html-icon{font-size:18px;line-height:1}.hidden{display:none!important}.static-main{margin-left:280px;min-height:100vh}.nav-badge{margin-left:auto;font-size:10px;color:var(--gold);opacity:.7}.search-box{display:flex;gap:8px;align-items:center;border:1px solid var(--border-soft);background:#071725;border-radius:12px;padding:8px 12px;margin-bottom:20px}.search-box input{border:0;outline:0;background:transparent;color:var(--text);width:100%}.toast{position:fixed;right:25px;bottom:25px;background:#102B45;border:1px solid var(--border);padding:12px 16px;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.28);z-index:60;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.module-list-btn{font:inherit}.section-body{white-space:pre-wrap}.interview-answer{margin-top:20px}.save-indicator{color:var(--success)!important}.btn{border-radius:12px;padding:12px 16px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-weight:700;border:1px solid transparent}.btn.primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#17202A}.btn.secondary{background:rgba(255,255,255,.04);border-color:var(--border-soft);color:var(--ivory)}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast">Guardado</div>
  <script src="./bundle.js"></script>
</body>
</html>
