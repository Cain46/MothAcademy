<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06111A">
<meta name="description" content="Moth Academy · QA Study & Practice. Aprender · Practicar · Evolucionar.">
<meta name="moth-build" content="2026-09-08-branding-v4">
<title>Moth Academy · QA Study & Practice</title>
<link rel="icon" href="./assets/moth-logo.svg?v=4" type="image/svg+xml">
<style>html,body{margin:0;background:#06111A;color:#F5F1E8;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot span{color:#D5A641}</style>
</head>
<body><div class="boot">Cargando <span>&nbsp;Moth Academy…</span></div>
<script>
(async()=>{
  const response=await fetch('https://raw.githubusercontent.com/Cain46/MothAcademy/3bb9ba04c8943d035903f49adf33d13530f32fc1/index.html?build=20260908v4');
  if(!response.ok) throw new Error('No se pudo cargar la aplicación base');
  let html=await response.text();

  // La V1 original guarda el logo en la constante MOTH_MARK.
  html=html.replace(/const MOTH_MARK='data:image\/[a-zA-Z0-9+.-]+;base64,[^']+';/,
    "const MOTH_MARK='./assets/moth-logo.svg?v=4';");

  html=html.replace('.brand img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 5px 18px rgba(213,166,65,.14))}', '.brand img{width:74px;height:58px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(213,166,65,.18))}');
  html=html.replace('.hero-mark img{width:min(370px,100%);max-height:330px;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.28))}', '.hero-mark img{width:min(440px,100%);max-height:330px;object-fit:contain;filter:drop-shadow(0 18px 34px rgba(213,166,65,.14))}');
  html=html.replace('.mobile-brand img{height:39px;width:39px;object-fit:contain}', '.mobile-brand img{height:42px;width:64px;object-fit:contain}');

  document.open();document.write(html);document.close();
})().catch(err=>{document.body.innerHTML='<div class="boot">No se pudo cargar Moth Academy.<br><small>'+String(err)+'</small></div>'});
</script>
</body>
</html>
